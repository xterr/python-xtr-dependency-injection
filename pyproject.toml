[project]
name = "xtr-dependency-injection"
version = "0.1.0"
description = "A Symfony-style bundle and kernel layer for the xtr libraries, compiled to a wireup container."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Razvan Ceana", email = "razvan@ceana.ro" }
]
keywords = ["dependency-injection", "kernel", "bundle", "wireup", "container"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "wireup>=2.12,<3",
    "typing-extensions>=4.4",
]

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4.0",
    "ty>=0.0.83",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# ─────────────────────────────────────────────────────────────────
# basedpyright — typeCheckingMode = "all" sets every report flag to error
# ─────────────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]

reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# wireup exposes no public accessor for its return-type keying rule; the
# bridge wraps that gap in one place so nothing else has to (§9.4 of the plan).
[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_dependency_injection/compiler/_wireup_bridge.py"
reportPrivateUsage = "none"

# Signature synthesis wraps arbitrary factories: what they take and produce is
# unknowable statically, so Any is the honest type here. Scoped to the
# compiler only; every other package keeps these on.
[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_dependency_injection/compiler"
reportAny = "none"
reportExplicitAny = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"

# A bundle's hook signatures name the configurators it is handed, and those
# import NoConfig back. The imports are TYPE_CHECKING-only, so no cycle exists
# at runtime — only in the static graph.
[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_dependency_injection/bundle"
reportImportCycles = "none"

# An autoconfigurator's apply receives a ServiceConfigurator, which records
# autoconfigurators. TYPE_CHECKING-only on one side; no cycle at runtime.
[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_dependency_injection/builder"
reportImportCycles = "none"

# Tests pin private behaviour on purpose: tests/contract exists to prove the
# private compiler primitives against wireup (the same reason ruff's SLF001 is
# off for tests).
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"

# ─────────────────────────────────────────────────────────────────
# ruff — select = ["ALL"], minimal justified ignores
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Agent work plans and scratch space, not package source.
extend-exclude = [".omo", ".tmp"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (ruff documents these)
    "COM812",
    "ISC001",
    # Mutually-exclusive docstring conventions; keep the modern one
    "D203",
    "D213",
    # Project-specific noise
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # Exceptions compose their own messages from typed fields; the string at a
    # raise site is a `reason` data field. See xtr_dependency_injection/exception.
    "TRY003",
    "EM101",
    "EM102",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# wireup reads the annotations of what these tests register at runtime, so
# none of them can be deferred into a TYPE_CHECKING block.
"tests/contract/*.py" = ["TC001", "TC002", "TC003"]
"tests/fixtures/**/*.py" = ["TC001", "TC002", "TC003"]
"tests/**/*.py" = [
    "S101",    # assert is the point of pytest
    "S603",    # a fresh interpreter is the only way to assert a module was never imported
    "ARG",     # fixtures look unused
    "PLR2004", # magic numbers in test data
    "SLF001",  # tests reach into privates
    "D",       # test names are the docs
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ─────────────────────────────────────────────────────────────────
# ty — a second opinion on the source
# ─────────────────────────────────────────────────────────────────
[tool.ty.src]
include = ["src", "tests"]

# ─────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
